schema_version: 1

technology:
  id: wifi_reference
  display_name: Wi-Fi 6 reference
  family: IEEE 802.11ax
  implementation_status: profile_ready
  profile_purpose: fixed_robust_baseline

ns3:
  version: 3.46.1
  module: wifi
  phy_helper: ns3::SpectrumWifiPhyHelper
  channel_class: ns3::MultiModelSpectrumChannel
  error_rate_model: ns3::TableBasedErrorRateModel
  standard: WIFI_STANDARD_80211ax

comparison:
  traffic_profile_ref: configs/traffic/telecommand_safety.yaml
  conducted_tx_power_dbm: 14.0
  tx_antenna_gain_dbi: 0.0
  rx_antenna_gain_dbi: 0.0
  nominal_eirp_dbm: 14.0
  power_mode: common_controlled_eirp

phy:
  band: BAND_2_4GHZ
  channel_number: 1
  center_frequency_mhz: 2412.0
  channel_width_mhz: 20
  channel_settings: "{1, 20, BAND_2_4GHZ, 0}"
  data_mode: HeMcs0
  control_mode: HeMcs0
  guard_interval_ns: 800
  spatial_streams: 1
  approximate_nominal_phy_rate_bps: 8600000
  rx_noise_figure_db: 7.0
  rx_sensitivity_attribute_dbm_20mhz: -101.0
  cca_ed_threshold_dbm: -62.0
  cca_wifi_sensitivity_dbm: -82.0

mac:
  topology: infrastructure_point_to_point
  access_point_count: 1
  station_count: 1
  qos_supported: true
  rate_manager: ns3::ConstantRateWifiManager
  aggregation_enabled: false
  rts_cts_enabled_for_pilot_payloads: false
  native_ack_and_retry_policy: enabled_and_recorded
  application_mapping: udp_ipv4

preflight:
  maximum_application_payload_bps: 2290.666667
  raw_rate_utilization_lower_bound: 0.000266357
  raw_capacity_check: pass
  caveat: Raw-rate feasibility does not prove deadline or reliability compliance.

regulatory_context:
  country: PE
  unlicensed_band_mhz:
    - 2400.0
    - 2483.5
  cited_max_eirp_dbm: 36.0
  simulated_eirp_dbm: 14.0
  hardware_deployment_requires_homologation_review: true

sources:
  - id: ns3_release_3_46
    url: https://www.nsnam.org/releases/ns-3-46/
  - id: ns3_wifi_model
    url: https://www.nsnam.org/docs/release/3.46/models/html/wifi.html
  - id: ns3_wifi_user
    url: https://www.nsnam.org/docs/release/3.46/models/html/wifi-user.html
  - id: ns3_wifi_phy_source
    url: https://github.com/nsnam/ns-3-dev-git/blob/ns-3.46.1/src/wifi/model/wifi-phy.cc
  - id: mtc_rm_373_2021
    url: https://cdn.www.gob.pe/uploads/document/file/1861732/Resoluci%C3%B3n%20Ministerial%20nro%20373-2021-MTC/01.pdf

schema_version: 1

technology:
  id: lora_p2p_reference
  display_name: LoRa point-to-point reference
  family: LoRa_CSS
  implementation_status: adapter_and_profile_validation_required
  profile_purpose: robust_bw125_reference_baseline
  not_lorawan: true

ns3:
  version: 3.46.1
  bundled_module: lorawan
  bundled_module_version: 0.3.5
  bundled_module_scope: LoRaWAN_Class_A
  compatibility_limitation: >-
    LoraNetDevice is a LoRaWAN device and its own source notes that IP is not
    used in the standard. A direct point-to-point MAC adapter must be written
    before this profile can execute the common application service.
  required_adapter: custom_direct_lora_mac

comparison:
  traffic_profile_ref: configs/traffic/telecommand_safety.yaml
  conducted_tx_power_dbm: 14.0
  tx_antenna_gain_dbi: 0.0
  rx_antenna_gain_dbi: 0.0
  nominal_eirp_dbm: 14.0
  power_mode: common_controlled_eirp

phy:
  center_frequency_mhz: 915.2
  regional_reference: AU915-928
  bandwidth_hz: 125000
  spreading_factor: 7
  coding_rate: 4/5
  explicit_header: true
  payload_crc: true
  preamble_symbols: 8
  low_data_rate_optimization: false
  nominal_raw_bitrate_bps: 5468.75
  reference_rx_sensitivity_dbm: -123.0
  control_payload_time_on_air_ms: 41.216
  time_on_air_payload_bytes: 10

mac:
  topology: direct_half_duplex_pair
  lorawan_enabled: false
  channel_access: single_link_scheduled
  native_mac_ack: false
  application_ack_is_monitoring_only: true
  application_retransmissions: false
  application_mapping: custom_direct_lora_mac

preflight:
  scheduled_application_payload_bps: 4576
  safety_reserve_bps: 424
  maximum_application_payload_bps: 5000
  raw_rate_utilization_lower_bound: 0.914286
  control_period_ms: 20
  control_payload_time_on_air_ms: 41.216
  control_airtime_utilization: 2.0608
  scheduled_packet_airtime_utilization_lower_bound: 2.783232
  raw_capacity_check: pass
  control_period_airtime_check: fail
  packetized_airtime_check: fail
  overall_preflight_check: fail
  interpretation: >-
    The 5 kbit/s application budget is below the nominal raw bitrate, but this
    payload-only comparison hides LoRa packet overhead. A 10-byte command takes
    41.216 ms and is generated every 20 ms. The scheduled command, link-state
    and telemetry packets require at least 2.783232 channel-seconds per second,
    before reserve activation or retries. Simulation must report this overload
    rather than silently throttle or aggregate the control source.

feasibility_option:
  candidate_bandwidth_hz: 500000
  estimated_scheduled_packet_airtime_utilization: 0.695808
  status: requires_profile_validation
  note: >-
    At the same SF7 and coding rate, quadrupling bandwidth divides symbol time
    and packet airtime by four. This is a candidate for a separate sensitivity
    and regulatory review, not an automatic replacement of the reference mode.

regulatory_context:
  country: PE
  unlicensed_band_mhz:
    - 915.0
    - 928.0
  cited_max_eirp_dbm: 30.0
  simulated_eirp_dbm: 14.0
  channel_plan_is_reference_only: true
  hardware_deployment_requires_homologation_review: true

sources:
  - id: ns3_allinone_3_46
    url: https://www.nsnam.org/releases/ns-3-46/
  - id: ns3_lorawan_app
    url: https://apps.nsnam.org/app/lorawan/
  - id: lorawan_netdevice_source
    url: https://github.com/signetlabdei/lorawan/blob/v0.3.5/model/lora-net-device.h
  - id: semtech_lora_overview
    url: https://www.semtech.com/uploads/technology/LoRa/lora-and-lorawan.pdf
  - id: semtech_sx1276
    url: https://www.semtech.com/products/wireless-rf/lora-connect/sx1276
  - id: lora_alliance_rp002
    url: https://resources.lora-alliance.org/home/rp002-1-0-4-regional-parameters
  - id: mtc_ds_006_2013
    url: https://cdn.www.gob.pe/uploads/document/file/5412657/343700-decreto-supremo-n-006-2013-mtc.pdf
